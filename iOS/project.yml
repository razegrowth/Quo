# Quo for iPhone. Generate the Xcode project with `xcodegen` in this folder
# (iOS/quo-ios.sh does it and builds); the .xcodeproj is not kept in git.
name: Quo
options:
  bundleIdPrefix: com.edinabazi.quo
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: 8B6VFDJHA2
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "12"
    # YES where the build carries the iCloud entitlement (a device build
    # signed for the team); a simulator build without signing says NO and
    # reads a stand-in folder instead.
    QUO_CLOUDKIT: "YES"
targets:
  Quo:
    type: application
    platform: iOS
    sources:
      - path: Quo
      # The Mac app's own sync format and helpers, built here as they are
      # there, so the two can't drift (see Quo/Sync/MacTypes.swift).
      - path: ../Sources/Search/SyncMerge.swift
        group: Shared
      - path: ../Sources/Search/SyncRecord.swift
        group: Shared
      - path: ../Sources/Search/SyncTabs.swift
        group: Shared
      - path: ../Sources/Search/SyncHistory.swift
        group: Shared
      - path: ../Sources/Search/FilterList.swift
        group: Shared
      - path: ../Sources/Search/Engine.swift
        group: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.edinabazi.quo.ios
        PRODUCT_NAME: Quo
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: AppIconInk
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        CODE_SIGN_ENTITLEMENTS: Quo/Quo.entitlements
        INFOPLIST_FILE: Quo/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: YES
      configs:
        # Run from Xcode, SwiftUI without the optimiser is noticeably slower,
        # and that's how it gets judged on the phone. Optimised here too.
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
          SWIFT_COMPILATION_MODE: wholemodule
